<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIMÓN & SAL</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <body class="login-page">
  <div class="login-container">
    <!-- Lado Izquierdo -->
    <div class="left-section">
      <div class="circle-bg">
        <img src="./images/logo.png" alt="Logo Limon y Sal">
      </div>
    </div>

    <!-- Lado Derecho -->
    <div class="right-section">
      <div class="login-box">
        <div class="icon-user">
          <i class="bi bi-person-circle"></i>
        </div>

        <form id="loginForm">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-control">
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-control">
          </div>

          <button type="submit" class="btn btn-login">Iniciar sesion</button>
          <div class="text-center mt-2">
            <a href="#" class="forgot-link">Restablecer contraseña</a>
          </div>
        </form>

        <div class="mt-3">
          <button type="button" id="loginGoogle" class="btn btn-google w-100">
            <i class="bi bi-google"></i> Iniciar con Google
          </button>

          <button type="button" id="logoutGoogle" class="btn btn-secondary mt-2 w-100" style="display: none;">
            Cerrar sesión
          </button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
