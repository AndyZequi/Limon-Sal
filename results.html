<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIMÓN & SAL - Resultados de Búsqueda</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/home.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <!-- Header -->
  <header class="navbar-custom">
    <div class="container-fluid">
      <div class="navbar-content">
        <!-- Menu hamburguesa -->
        <button class="btn-menu">
          <img src="./images/menu.png" alt="Menu" class="icon-img">
        </button>

        <!-- Logo -->
        <div class="logo-container">
          <a href="home.html">
            <img src="./images/logo.png" alt="LIMÓN & SAL" class="logo">
          </a>
        </div>

        <!-- Barra de búsqueda -->
        <div class="search-container">
          <input type="text" id="buscarRecetas" class="buscar-receta" placeholder="Busca una receta">
          <img src="./images/busqueda-de-lupa.png" alt="Buscar" id="searchBtn" class="search-icon" style="cursor:pointer">
        </div>

        <!-- Botones de sesión -->
        <div class="auth-buttons">
          <button class="btn-auth btn-login">Inicia Sesión</button>
          <button class="btn-auth btn-register">Registrate</button>
        </div>

        <!-- Icono de usuario -->
        <a href="user.html" class="user-icon">
          <img src="./images/usuario.png" alt="Usuario" class="icon-user-img">
        </a>
      </div>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="results-container">
    <div class="container">
      <!-- Título de la página -->
      <div class="results-header">
        <h1 class="results-title">Resultados de Búsqueda</h1>
        <p id="searchTerm" class="search-term-text"></p>
        <a href="home.html" class="back-link">
          <i class="bi bi-arrow-left"></i> Volver al inicio
        </a>
      </div>

      <!-- Contenedor de resultados -->
      <div id="recipesContainer" class="row g-4 mt-4"></div>

      <!-- Mensaje cuando no hay resultados -->
      <div id="noResults" class="no-results text-center" style="display: none;">
        <i class="bi bi-search" style="font-size: 4rem; color: #ccc; margin-bottom: 20px;"></i>
        <h3>No se encontraron recetas</h3>
        <p class="text-muted">Intenta con otros términos de búsqueda</p>
        <a href="home.html" class="btn btn-primary mt-3">
          <i class="bi bi-house"></i> Volver al inicio
        </a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./js/results.js"></script>
</body>
</html>
